<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FRONTIER UI Preview</title>
  <style>
    :root {
      --bg: #0e0e10;
      --card: #17171a;
      --card-hover: #1c1c20;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f0f0f5;
      --dim: #848490;
      --accent: #f0f0f8;
      --accent-soft: rgba(240, 240, 248, 0.85);
      --ahead: #b7a0f6;
      --toggle-on: #ececf4;
      --radius: 14px;
      --font: "Segoe UI", system-ui, sans-serif;
      --mono: Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(183, 160, 246, 0.12), transparent 55%),
        linear-gradient(160deg, #12121a 0%, #08080c 45%, #0a0a0f 100%);
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
    }

    .game-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.55)),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 48px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 48px),
        linear-gradient(135deg, #3a5f8c 0%, #6b4a7a 35%, #2d4a3e 70%, #1a1a24 100%);
      filter: blur(2px) saturate(1.1);
      transform: scale(1.03);
    }

    .hud-note {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 5;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(8, 8, 12, 0.72);
      font-size: 12px;
      color: var(--dim);
      max-width: 320px;
      line-height: 1.45;
    }
    .hud-note strong { color: var(--text); }

    .mode-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      gap: 8px;
    }
    .mode-toggle button {
      border: 1px solid var(--border);
      background: rgba(8, 8, 12, 0.72);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .mode-toggle button.active {
      border-color: rgba(183, 160, 246, 0.45);
      background: rgba(183, 160, 246, 0.12);
      color: var(--ahead);
    }

    .menu {
      position: relative;
      z-index: 2;
      width: 600px;
      height: 780px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: rgba(14, 14, 16, 0.96);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: rise 0.35s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }

    .topbar {
      height: 48px;
      padding: 8px 16px 0;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #0c0c0f, #0e0e10);
      position: relative;
    }
    .topbar::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      border-radius: 2px;
      background: var(--accent-soft);
    }
    .topbar::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      top: 1px;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand .accent { color: var(--accent); }
    .brand .ahead { color: var(--ahead); }
    .subtitle {
      font-size: 11px;
      color: var(--dim);
      margin-top: 2px;
    }

    .body {
      flex: 1;
      padding: 8px 10px 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .tab {
      height: 26px;
      border: none;
      border-radius: 7px;
      background: #141416;
      color: var(--dim);
      font-size: 11px;
      cursor: pointer;
      position: relative;
    }
    .tab:hover { background: #18181c; color: var(--text); }
    .tab.active {
      background: #292930;
      color: var(--text);
    }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 0;
      height: 2px;
      border-radius: 2px;
      background: var(--accent);
    }

    .panel {
      flex: 1;
      overflow: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .subtabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .subtab {
      border: 1px solid var(--border);
      background: #121216;
      color: var(--dim);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 11px;
      cursor: pointer;
    }
    .subtab.active {
      color: var(--text);
      border-color: rgba(240,240,248,0.25);
      background: #1e1e24;
    }

    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 26px;
      font-size: 11px;
      color: #d8d8e0;
    }
    .row + .row { margin-top: 4px; }

    .toggle {
      width: 34px;
      height: 18px;
      border-radius: 999px;
      background: #2a2a32;
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #666;
      transition: 0.15s ease;
    }
    .toggle.on { background: #3a3a44; }
    .toggle.on::after {
      left: 18px;
      background: var(--toggle-on);
    }

    .key {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #1c1c22;
      color: var(--text);
    }

    .slider-row label {
      display: block;
      font-size: 11px;
      color: #d8d8e0;
      margin-bottom: 4px;
    }
    .slider-row input[type=range] {
      width: 100%;
      accent-color: var(--accent);
    }

    .footer {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      background: #0b0b0d;
    }

    .float-bar {
      display: none;
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      padding: 8px 10px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(14, 14, 16, 0.94);
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      gap: 4px;
    }
    .float-bar.show { display: flex; }
    .float-icon {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #9696a4;
      font-size: 14px;
      cursor: pointer;
    }
    .float-icon.active, .float-icon:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .float-panel {
      display: none;
      position: absolute;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      width: 520px;
      max-height: 620px;
      overflow: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(14, 14, 16, 0.97);
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .float-panel.show { display: block; }

    .hidden { display: none !important; }

    @media (max-width: 700px) {
      .menu { width: calc(100vw - 24px); height: calc(100vh - 24px); }
      .cols { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="game-bg" aria-hidden="true"></div>

  <div class="hud-note">
    <strong>FRONTIER UI preview</strong><br />
    Static HTML mockup — open this file in Chrome/Edge. Not the real ImGui build.
    Toggle layout mode top-right.
  </div>

  <div class="mode-toggle">
    <button id="btnClassic" class="active" type="button">Classic menu</button>
    <button id="btnFloat" type="button">Floating header</button>
  </div>

  <div class="scene">
    <div class="float-bar" id="floatBar"></div>
    <div class="float-panel" id="floatPanel"></div>

    <div class="menu" id="classicMenu">
      <div class="topbar">
        <div class="brand"><span class="ahead">FRONTIER</span> <span style="color:var(--dim);font-weight:500">· See ahead. Built open.</span></div>
        <div class="subtitle" id="tabSubtitle">Combat</div>
      </div>
      <div class="body">
        <div class="tabs" id="mainTabs"></div>
        <div class="panel" id="panel"></div>
      </div>
      <div class="footer" id="footer">FRONTIER | version-f5a60436d48947d3 | 144 fps</div>
    </div>
  </div>

  <script>
    const TABS = ["Combat", "Visuals", "World", "Character", "Options", "Explorer", "Servers", "Music", "Status"];
    const FLOAT_ICONS = ["⊕", "◎", "◉", "⌁", "⚙", "⎇", "⇄", "♫", "ℹ"];

    let activeTab = 0;
    let activeSub = 0;
    let floatOpen = true;

    const panel = document.getElementById("panel");
    const floatPanel = document.getElementById("floatPanel");
    const floatBar = document.getElementById("floatBar");
    const classicMenu = document.getElementById("classicMenu");

    function toggle(el) {
      el.classList.toggle("on");
    }

    function row(label, on, key) {
      return `<div class="row"><span>${label}</span><div style="display:flex;gap:6px;align-items:center">${key ? `<span class="key">${key}</span>` : ""}<div class="toggle${on ? " on" : ""}" onclick="toggle(this)"></div></div></div>`;
    }

    function slider(label, val) {
      return `<div class="slider-row"><label>${label} <span style="color:var(--dim)">${val}</span></label><input type="range" min="0" max="100" value="${val}" oninput="this.previousElementSibling.querySelector('span').textContent=this.value" /></div>`;
    }

    function combatHtml() {
      const subs = ["Aimbot", "Hitbox", "Desync", "Guns"];
      const subHtml = subs.map((s, i) => `<button class="subtab${i === activeSub ? " active" : ""}" type="button" data-sub="${i}">${s}</button>`).join("");
      if (activeSub !== 0) {
        return `<div class="subtabs">${subHtml}</div><div class="card"><h3>${subs[activeSub]}</h3><p style="font-size:11px;color:var(--dim);margin:0">Placeholder panel — same card style as Aimbot in the real menu.</p></div>`;
      }
      return `
        <div class="subtabs">${subHtml}</div>
        <div class="cols">
          <div>
            <div class="card">
              <h3>Aimbot</h3>
              ${row("Enabled", true, "rmb")}
              ${row("Always On", false)}
              ${row("Toggle Mode", false)}
              ${row("Show FOV", true)}
              ${row("Wall Check", true)}
              ${row("Sticky Aim", true)}
              ${row("Predict Movement", false)}
              ${row("Humanize", false)}
              ${row("Team Check", true)}
              ${row("Skip Dead", true)}
            </div>
            <div class="card">
              <h3>Triggerbot</h3>
              ${row("Enabled", false, "x")}
            </div>
          </div>
          <div>
            <div class="card">
              <h3>Feel</h3>
              ${slider("Smoothness", 31)}
              ${slider("Stability", 35)}
              ${slider("Lock Zone", 20)}
              ${slider("FOV Size", 45)}
              ${slider("Sticky FOV", 55)}
              ${slider("Aim Speed", 40)}
              ${slider("Range", 80)}
            </div>
            <div class="card" style="opacity:0.55">
              <h3>Rage</h3>
              ${row("Enabled", false)}
            </div>
          </div>
        </div>`;
    }

    function visualsHtml() {
      return `<div class="card"><h3>ESP</h3>${row("Box ESP", true)}${row("Name ESP", true)}${row("Health Bar", true)}${row("Skeleton", false)}${row("Chams", false)}</div><div class="card"><h3>Combat FX</h3>${row("Hit Sound", false)}${row("Hit Marker", true)}</div>`;
    }

    function statusHtml() {
      return `<div class="card"><h3>Session</h3><div class="row"><span>Client</span><span style="color:var(--dim);font-family:var(--mono)">version-f5a60436d48947d3</span></div><div class="row"><span>Place</span><span style="color:var(--dim)">286090429</span></div><div class="row"><span>Players</span><span style="color:var(--dim)">12</span></div></div><div class="card"><h3>Actions</h3><div class="row"><span>Open Site</span><span class="key">trace-host</span></div><div class="row"><span>Discord</span><span class="key">join</span></div></div>`;
    }

    function genericHtml(name) {
      return `<div class="card"><h3>${name}</h3><p style="font-size:11px;color:var(--dim);margin:0">Preview placeholder for the ${name} tab. Cards, toggles, and sliders match the in-game ImGui layout.</p></div>`;
    }

    function renderPanel(target) {
      let html;
      switch (activeTab) {
        case 0: html = combatHtml(); break;
        case 1: html = visualsHtml(); break;
        case 8: html = statusHtml(); break;
        default: html = genericHtml(TABS[activeTab]);
      }
      target.innerHTML = html;
      target.querySelectorAll(".subtab").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeSub = Number(btn.dataset.sub);
          renderPanel(target);
        });
      });
    }

    function renderTabs(container, isFloat) {
      container.innerHTML = TABS.map((name, i) => {
        if (isFloat) {
          return `<button class="float-icon${i === activeTab && floatOpen ? " active" : ""}" type="button" data-tab="${i}" title="${name}">${FLOAT_ICONS[i]}</button>`;
        }
        return `<button class="tab${i === activeTab ? " active" : ""}" type="button" data-tab="${i}">${name}</button>`;
      }).join("");
      container.querySelectorAll("[data-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.dataset.tab);
          if (isFloat && activeTab === i) floatOpen = !floatOpen;
          else { activeTab = i; floatOpen = true; activeSub = 0; }
          document.getElementById("tabSubtitle").textContent = TABS[activeTab];
          refresh();
        });
      });
    }

    function refresh() {
      renderTabs(document.getElementById("mainTabs"), false);
      renderTabs(floatBar, true);
      renderPanel(panel);
      renderPanel(floatPanel);
    }

    document.getElementById("btnClassic").addEventListener("click", () => {
      classicMenu.classList.remove("hidden");
      floatBar.classList.remove("show");
      floatPanel.classList.remove("show");
      document.getElementById("btnClassic").classList.add("active");
      document.getElementById("btnFloat").classList.remove("active");
    });

    document.getElementById("btnFloat").addEventListener("click", () => {
      classicMenu.classList.add("hidden");
      floatBar.classList.add("show");
      floatPanel.classList.add("show");
      document.getElementById("btnFloat").classList.add("active");
      document.getElementById("btnClassic").classList.remove("active");
      refresh();
    });

    refresh();
  </script>
</body>
</html>
